let TL = buildTimeline();
// Instagram lays its top bar over the first ~8% of a Reel, its caption over the bottom fifth and its buttons over the

// the Instagram copy) keeps the title and subtitles inside what stays visible everywhere; YouTube keeps the original.

let BGM = null;  // the backdrop always fills the frame, even when the 'ig' layout shrinks the scene
const norm = w => w.toLocaleLowerCase('tr').replace(/[.,!?;:"“”'’()]/g, '');
// time of the first word in line L starting with prefix (fallback: a share of the line)
function wordTime(L, prefix, share = .35) {

    const p = norm(prefix);
    const w = L.words.find(w => norm(w.w).startsWith(p) || (p.length > 3 && norm(w.w).includes(p)));
    if (w) return w.t0;

window.DURATION = () => TL.at(-1).t1 + 1.6;
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);

// ---------- emoji cache: each glyph is rasterised once, then scaled ----------
const EMO = {};
const EBASE = 512;

  if (!ch || size < 2 || alpha <= 0) return;

  if (!c) {

    const g = c.getContext('2d');

    g.fillText(ch, c.width / 2, c.height / 2 + EBASE * .04);

  ctx.restore();

// ---------- pieces ----------
function bg(name, t) {

  ctx.save(); if (BGM) ctx.setTransform(BGM);
  if (f) f(t); else { vgrad(C.space1, C.space2); starfield(t); }
  ctx.restore();
}
// fallbacks until arkaplan.js provides a body (earth and moon as in the pilot)
function fbEarth(x, y, r, t, tilt = 0.41) {

}
const FBCOL = { sun: ['#fff3a0', '#ffb300', 'rgba(255,180,40,.8)'], mars: ['#ff9a6b', '#b8401f', 'rgba(255,110,60,.4)'], venus: ['#fff0c4', '#d9a85b', 'rgba(255,220,150,.4)'],
  mercury: ['#d9d4cf', '#7d7670', 'rgba(220,220,220,.3)'], jupiter: ['#f3d9b1', '#b07a4f', 'rgba(255,200,150,.35)'], saturn: ['#f6e3b4', '#c39a52', 'rgba(255,220,150,.35)'],
  uranus: ['#c9f6f6', '#5bc4cf', 'rgba(120,230,240,.4)'], neptune: ['#8fb6ff', '#2a4fd0', 'rgba(90,140,255,.45)'], pluto: ['#efe0cf', '#9c7f66', 'rgba(230,210,190,.3)'],
  star: ['#ffffff', '#ffe27a', 'rgba(255,240,170,.8)'], asteroid: ['#a39a90', '#5e554d', 'rgba(0,0,0,0)'], comet: ['#e8f6ff', '#8fd3ff', 'rgba(150,220,255,.6)'],
  blackhole: ['#000', '#000', 'rgba(255,140,40,.7)'], galaxy: ['#ffe9ff', '#7b4dff', 'rgba(170,120,255,.6)'] };

  },
  question(V, L, t, lt) {
    bg(V.bg || 'space', t);
    const s = back(prog(lt, 0, .5));
    if (V.e) emoji(V.e, 400, 760 + Math.sin(t * 2) * 18, 330 * s);

  },
  split(V, L, t, lt) {
    bg(V.bg || 'space', t);
    const kt = wordTime(L, V.key, .45);
    [[V.left, 285, C.cyan, back(prog(lt, 0, .45))], [V.right, 795, C.yellow, back(prog(t, kt, kt + .45))]].forEach(([it, x, col, k]) => {

      ctx.strokeStyle = col; ctx.lineWidth = 8; rr(-235, -330, 470, 660, 50); ctx.stroke();
      ctx.restore();

    });
    const ka = back(prog(t, kt - .2, kt + .2));
    if (ka > .01) { ctx.save(); ctx.translate(540, 740); ctx.scale(ka, ka); circle(0, 0, 62, C.mag); text('➜', 4, 2, 70, C.white); ctx.restore(); }
  },
  timeline(V, L, t, lt) {
    bg(V.bg || 'space', t);

    const gap = Math.min(250, 760 / n), y0 = 740 - gap * (n - 1) / 2;

  },
  outro(V, L, t, lt) {

    emoji(V.e || '💬', 540, 700 + Math.sin(t * 2.4) * 16, 300 * back(prog(lt, 0, .5)));
    pill('SIRADAKİ SORU', 540, 420, 76, C.mag, C.white, back(prog(lt, .1, .6)));
    pill('SENİN!', 540, 1000, 96, C.yellow, C.ink, back(prog(lt, .4, .9)));

};

// ---------- characters (as in the pilot) ----------
function mouthOpen(t, line, who) {
  if (!line || line.who !== who || t < line.t0 || t > line.t1) return 0;
  const w = line.words.find(w => t >= w.t0 && t <= w.t1);
  if (!w) return 0.1;
  const p = (t - w.t0) / Math.max(.01, w.t1 - w.t0);
  return clamp(Math.abs(Math.sin(p * Math.PI * Math.max(1, Math.round(w.w.length / 2.5)))) * .9 + .1);
}
function blink(t, seed) { const p = (t + seed) % 3.7; return p < .12 ? 1 - Math.abs(p - .06) / .06 : 0; }
function drawPi(x, y, s, t, talk, active) {
  ctx.save(); ctx.translate(x, y + Math.sin(t * 1.8) * 4); ctx.scale(s, s);
  ctx.fillStyle = C.coat; rr(-125, 95, 250, 320, 90); ctx.fill();
  ctx.fillStyle = '#4a6cff'; ctx.beginPath(); ctx.moveTo(-40, 100); ctx.lineTo(40, 100); ctx.lineTo(0, 200); ctx.fill();
  ctx.fillStyle = C.red; ctx.beginPath(); ctx.moveTo(-10, 112); ctx.lineTo(10, 112); ctx.lineTo(15, 185); ctx.lineTo(0, 205); ctx.lineTo(-15, 185); ctx.fill();
  ctx.strokeStyle = '#cfd5e6'; ctx.lineWidth = 5; ctx.beginPath(); ctx.moveTo(-40, 100); ctx.lineTo(-20, 330); ctx.moveTo(40, 100); ctx.lineTo(20, 330); ctx.stroke();
  ctx.fillStyle = '#d7dce9'; rr(60, 190, 46, 40, 8); ctx.fill();
  [[70, C.red], [84, C.cyan], [98, C.yellow]].forEach(([px, c]) => { ctx.fillStyle = c; rr(px - 4, 172, 8, 26, 3); ctx.fill(); });
  const ang = active ? -0.9 + Math.sin(t * 3) * .12 : 0.25;
  ctx.save(); ctx.translate(-105, 150); ctx.rotate(ang);
  ctx.fillStyle = C.coat; rr(-28, -10, 56, 150, 28); ctx.fill();
  circle(0, 150, 26, C.skin);
  ctx.restore();
  circle(0, 0, 100, C.skin);
  circle(-98, 10, 20, C.skin); circle(98, 10, 20, C.skin);
  ctx.fillStyle = '#f1f3f8';
  [[-100, -40, 42], [-80, -85, 40], [-35, -110, 42], [15, -115, 44], [65, -95, 42], [100, -50, 40], [-118, 5, 30], [118, 5, 30]].forEach(([hx, hy, r]) => { ctx.beginPath(); ctx.arc(hx, hy, r, 0, Math.PI * 2); ctx.fill(); });
  ctx.fillStyle = C.skin; ctx.beginPath(); ctx.ellipse(0, -55, 70, 40, 0, 0, Math.PI * 2); ctx.fill();
  ctx.strokeStyle = '#e9ecf4'; ctx.lineWidth = 12; ctx.lineCap = 'round';
  const br = active ? -6 : 0;
  ctx.beginPath(); ctx.moveTo(-62, -26 + br); ctx.lineTo(-22, -32 + br); ctx.moveTo(62, -26 + br); ctx.lineTo(22, -32 + br); ctx.stroke();
  const bl = blink(t, 1.3);
  [-42, 42].forEach(ex => {
    circle(ex, 4, 30, 'rgba(255,255,255,.85)');
    ctx.fillStyle = C.ink; ctx.beginPath(); ctx.ellipse(ex + 3, 6, 9, 11 * (1 - bl) + 1, 0, 0, Math.PI * 2); ctx.fill();
    ctx.strokeStyle = '#2b2f4a'; ctx.lineWidth = 7; ctx.beginPath(); ctx.arc(ex, 4, 30, 0, Math.PI * 2); ctx.stroke();
  });
  ctx.beginPath(); ctx.moveTo(-12, 2); ctx.quadraticCurveTo(0, -6, 12, 2); ctx.stroke();
  ctx.fillStyle = '#eaa985'; ctx.beginPath(); ctx.ellipse(0, 36, 16, 13, 0, 0, Math.PI * 2); ctx.fill();
  const m = talk;
  ctx.fillStyle = '#5a1e2a'; ctx.beginPath(); ctx.ellipse(0, 70, 22 + m * 6, 4 + m * 18, 0, 0, Math.PI * 2); ctx.fill();
  if (m > .3) { ctx.fillStyle = '#ff7b8a'; ctx.beginPath(); ctx.ellipse(0, 70 + m * 10, 12, m * 7, 0, 0, Math.PI * 2); ctx.fill(); }
  ctx.fillStyle = '#f1f3f8';
  ctx.beginPath(); ctx.ellipse(-24, 54, 30, 13, -.25, 0, Math.PI * 2); ctx.ellipse(24, 54, 30, 13, .25, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function drawBit(x, y, s, t, talk, active) {
  const hy = Math.sin(t * 2.4) * 14;
  ctx.save(); ctx.translate(x, y + hy); ctx.scale(s, s);
  glow(0, 250, 120, 'rgba(62,230,255,.9)', .55 + .2 * Math.sin(t * 20));
  ctx.fillStyle = 'rgba(62,230,255,.85)'; ctx.beginPath(); ctx.moveTo(-30, 205); ctx.quadraticCurveTo(0, 270 + Math.sin(t * 25) * 10, 30, 205); ctx.fill();
  ctx.fillStyle = '#e9edf7'; rr(-95, 80, 190, 140, 60); ctx.fill();
  ctx.fillStyle = C.mag; rr(-30, 120, 60, 50, 18); ctx.fill();
  circle(0, 145, 12 + Math.sin(t * 4) * 2, '#ffd1f5');
  const wave = active ? Math.sin(t * 8) * .5 : Math.sin(t * 2) * .1;
  [[-1, -.4 - wave], [1, .4]].forEach(([sd, a]) => { ctx.save(); ctx.translate(sd * 100, 120); ctx.rotate(a * sd); ctx.fillStyle = '#d5dbec'; rr(-16, -10, 32, 80, 16); ctx.fill(); circle(0, 75, 20, C.cyan); ctx.restore(); });
  ctx.fillStyle = '#e9edf7'; rr(-130, -120, 260, 200, 80); ctx.fill();
  ctx.fillStyle = '#0b1036'; rr(-105, -95, 210, 150, 60); ctx.fill();
  ctx.strokeStyle = '#c7cfe4'; ctx.lineWidth = 8; ctx.beginPath(); ctx.moveTo(0, -120); ctx.lineTo(0, -175); ctx.stroke();
  glow(0, -185, 60, 'rgba(255,79,216,.9)', .5 + .3 * Math.sin(t * 5));
  circle(0, -185, 18, C.mag);
  const bl = blink(t, 0.4);
  ctx.fillStyle = C.cyan;
  const eh = 46 * (1 - bl) + 4;
  rr(-60, -50 - eh / 2 + 4, 34, eh, 17); ctx.fill(); rr(26, -50 - eh / 2 + 4, 34, eh, 17); ctx.fill();
  ctx.strokeStyle = C.cyan; ctx.lineWidth = 7; ctx.lineCap = 'round'; ctx.beginPath();
  for (let i = 0; i <= 20; i++) { const px = -45 + i * 4.5, py = 18 + Math.sin(i * 1.1 + t * 30) * talk * 16 * Math.sin(i / 20 * Math.PI); i ? ctx.lineTo(px, py) : ctx.moveTo(px, py); }
  if (talk < .05) { ctx.beginPath(); ctx.arc(0, 4, 26, .25 * Math.PI, .75 * Math.PI); }
  ctx.stroke();
  ctx.fillStyle = 'rgba(255,79,216,.45)'; ctx.beginPath(); ctx.ellipse(-78, 0, 12, 8, 0, 0, Math.PI * 2); ctx.ellipse(78, 0, 12, 8, 0, 0, Math.PI * 2); ctx.fill();
  ctx.restore();
}
function characters(t, line) {
  const piTalk = mouthOpen(t, line, 'pi'), bitTalk = mouthOpen(t, line, 'bit');
  const piAct = line && line.who === 'pi', bitAct = line && line.who === 'bit';
  const g = ctx.createLinearGradient(0, LY.band, 0, H); g.addColorStop(0, 'rgba(5,7,25,0)'); g.addColorStop(.35, 'rgba(5,7,25,.85)'); g.addColorStop(1, 'rgba(5,7,25,.95)');
  ctx.fillStyle = g; ctx.fillRect(0, LY.band, W, H - LY.band);
  const ps = lerp(.82, .9, piAct ? 1 : 0), bs = lerp(.78, .86, bitAct ? 1 : 0);
  ctx.globalAlpha = piAct || !line ? 1 : .8; drawPi(LY.pi[0], LY.pi[1], ps, t, piTalk, piAct); ctx.globalAlpha = 1;
  ctx.globalAlpha = bitAct || !line ? 1 : .8; drawBit(LY.bit[0], LY.bit[1], bs, t, bitTalk, bitAct); ctx.globalAlpha = 1;
}

// ---------- overlays ----------
function titleBar(t) {
  const s = lerp(.88, 1, back(prog(t, 0, .4)));  // visible from the first frame (it is the feed preview)
  ctx.save(); ctx.translate(540, LY.title); ctx.scale(s, s);
  if (LY.pill) pill((EP.series || 'YA OLSAYDI?').toLocaleUpperCase('tr'), 0, -78, 34, C.mag, C.white);
  const hi = (EP.title.hi || '').toLocaleUpperCase('tr'), rest = (EP.title.rest || '').toLocaleUpperCase('tr');
  let size = 92; ctx.font = `900 ${size}px ${F}`;
  const sp = hi && rest ? ctx.measureText(' ').width : 0;
  let w1 = ctx.measureText(hi).width, w2 = ctx.measureText(rest).width;
  if (w1 + sp + w2 > 1000) {
    if (Math.max(w1, w2) <= 1000 && hi && rest) {  // two lines
      const s2 = Math.min(84, Math.floor(92 * 1000 / Math.max(w1, w2)));
      text(hi, 0, 22, s2, C.yellow, 900, 'center', 16); text(rest, 0, 22 + s2 * 1.02, s2, C.white, 900, 'center', 16);
      ctx.restore(); return;
    }
    size = Math.floor(92 * 1000 / (w1 + sp + w2)); ctx.font = `900 ${size}px ${F}`;
    w1 = ctx.measureText(hi).width; w2 = ctx.measureText(rest).width;
  }
  const x0 = -(w1 + sp + w2) / 2;
  text(hi, x0, 40, size, C.yellow, 900, 'left', 16);
  text(rest, x0 + w1 + sp, 40, size, C.white, 900, 'left', 16);
  ctx.restore();
}
function subtitles(t, line) {
  if (!line || t > line.t1 + .3) return;
  const words = line.words;
  let idx = words.findIndex(w => t >= w.t0 && t < w.t1);
  if (idx < 0) { idx = 0; words.forEach((w, i) => { if (t >= w.t0) idx = i; }); }
  ctx.font = `900 76px ${F}`;
  const up = w => w.toLocaleUpperCase('tr');
  const wd = w => ctx.measureText(up(w)).width;
  const groups = []; let cur = [];
  words.forEach((w, i) => { const tw = [...cur, i].reduce((a, j) => a + wd(words[j].w) + 22, -22); if (cur.length && (cur.length >= 3 || tw > 960)) { groups.push(cur); cur = []; } cur.push(i); });
  groups.push(cur);
  const grp = groups.find(g => g.includes(idx));
  let size = 76; const tw = grp.reduce((a, j) => a + wd(words[j].w) + 22, -22); if (tw > 980) size = Math.floor(76 * 980 / tw);
  ctx.font = `900 ${size}px ${F}`;
  const ws = grp.map(j => wd(words[j].w)); const total = ws.reduce((a, b) => a + b, 0) + 22 * (grp.length - 1);
  let x = 540 - total / 2; const y = LY.subs;
  const hl = line.who === 'pi' ? C.yellow : C.cyan;
  const keys = (line.keys || []).map(norm);
  grp.forEach((j, k) => {
    const w = words[j].w, active = j === idx;
    const isKey = /\d/.test(w) || keys.some(p => p && norm(w).startsWith(p));
    const pop = active ? 1 + .12 * (1 - eo(prog(t, words[j].t0, words[j].t0 + .14))) : 1;
    ctx.save(); ctx.translate(x + ws[k] / 2, y); ctx.scale(pop, pop);
    if (active) { ctx.fillStyle = isKey ? C.mag : hl; rr(-ws[k] / 2 - 12, -size * .6, ws[k] + 24, size * 1.2, 18); ctx.fill(); }
    text(up(w), 0, 3, size, active ? (isKey ? C.white : C.ink) : (isKey ? hl : C.white), 900, 'center', active ? 0 : 12);
    ctx.restore(); x += ws[k] + 22;
  });
}
function nameTag(t, line) {
  if (!line || t > line.t1 || !LY.tag) return;
  const pi = line.who === 'pi';
  ctx.globalAlpha = clamp((t - line.t0) * 6);
  pill(pi ? 'PROF. Pİ' : 'BİT', pi ? LY.pi[0] : LY.bit[0], LY.tag, 30, pi ? C.yellow : C.cyan, C.ink);
  ctx.globalAlpha = 1;
}

window.setTimings = tm => { window.TIMINGS = tm; TL = buildTimeline(); };
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowColor = 'transparent';
  let li = TL.findIndex(l => t < l.t1 + 0.2); if (li < 0) li = TL.length - 1;
  const line = TL[li];
  // a scene lasts while consecutive lines share the same visual
  let si = li; while (si > 0 && same(TL[si - 1].v, line.v)) si--;
  const sceneStart = si === 0 ? 0 : TL[si].t0 - 0.15;
  const lt = Math.max(0, t - sceneStart);
  const z = 1 + .05 * (1 - eo(prog(lt, 0, .35)));
  ctx.save(); ctx.translate(540, 760); ctx.scale(z, z); ctx.translate(-540, -760); BGM = ctx.getTransform(); ctx.restore();
  ctx.save(); ctx.translate(540, LY.scene); ctx.scale(z * LY.k, z * LY.k); ctx.translate(-540, -760);
  const V = line.v || { t: 'question' };
  (VIS[V.t] || VIS.question)(V, line, t, lt);
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowColor = 'transparent';
  if (lt < .14 && si > 0) { ctx.fillStyle = `rgba(255,255,255,${(1 - lt / .14) * .35})`; ctx.fillRect(0, 0, W, H); }
  characters(t, t >= line.t0 && t <= line.t1 ? line : null);
  titleBar(t);
  if (window.COVER) return;
  nameTag(t, line);
  subtitles(t, t >= line.t0 - .05 ? line : null);
};
// cover image: the scene of line `li` at its key moment, big title, both characters
window.cover = function (li) {
  const L = TL[li], V = L.v || {};
  const kt = Math.min(L.t1 - .05, wordTime(L, V.key || V.value, .35) + 1.3);
  window.COVER = true; draw(kt); window.COVER = false;
  return kt;
};
window.ready = document.fonts.load(`900 40px ${F}`).then(() => document.fonts.load(`700 40px ${F}`))
  .then(() => {
    const em = new Set();
    JSON.stringify(EP.lines).replace(/"e":"([^"]+)"/g, (_, e) => em.add(JSON.parse(`"${e}"`)));
    ['💬', '❄️', '🔥', '❓'].forEach(e => em.add(e));
    return Promise.all([...em].map(e => document.fonts.load(`100px ${EMOJI}`, e)));
  })
  .then(() => { draw(0); return true; });
</script></body></html>
