<!doctype html>
<html><head><meta charset="utf-8">
<link rel="stylesheet" href="fonts.css">
<style>html,body{margin:0;background:#000}canvas{display:block}</style>
</head><body>
<canvas id="c" width="1080" height="1920"></canvas>
<script src="ortak.js"></script>
<script src="karakter.js"></script>
<script src="mekan.js"></script>
<script src="bolum.js"></script>
<script src="sahne.js"></script>
<script>
// Zirvenin Kanunu episode engine. bolum.js sets window.EP:
//   {kanun: 'I', title: {top, hi}, lines: [{text, v: {t: <scene>, key, ...}}], tablolar: [{id, ...}]}
// sahne.js (a copy of bolumler/<id>.js) adds the episode's own scenes to SAHNE; usta, the hooded narrator who opens
// and closes every episode, lives here. Scenes are cartoon (karakter.js, mekan.js, sokak.js); real public-domain
// paintings from tablolar/<id>.jpg appear where a real person or place is named.
// render.js injects the narrator's word timings with setTimings([{t0, t1, words: [{w, t0, t1}]}]).
// The last line leads back into the first ("Bu yüzden unutma:" -> the hook), so the video loops.
const EP = window.EP;
const IMG = {};
const imagesReady = Promise.all((EP.tablolar || []).map(tb => new Promise(res => {
  const im = new Image(); im.onload = im.onerror = () => res(); im.src = `tablolar/${tb.id}.jpg`; IMG[tb.id] = im;
})));
function buildTimeline() {
  if (window.TIMINGS) return window.TIMINGS.map((tm, i) => ({ ...EP.lines[i], ...tm }));
  let t = 0.12; const out = [];
  EP.lines.forEach(l => {
    const ws = []; let tt = t;
    l.text.split(' ').forEach(w => { const d = 0.14 + w.length * 0.045 + (/[.,!?:]$/.test(w) ? 0.2 : 0); ws.push({ w, t0: tt, t1: tt + d }); tt += d; });
    out.push({ ...l, t0: t, t1: tt, words: ws });
    t = tt + 0.22;
  });
  return out;
}
let TL = buildTimeline();
window.DURATION = () => TL.at(-1).t1 + 0.45;
const norm = w => w.toLocaleLowerCase('tr').replace(/[.,!?;:"“”'’()]/g, '');
function wordTime(L, prefix, share = .35) {
  if (prefix) {
    const p = norm(prefix);
    const w = L.words.find(w => norm(w.w).startsWith(p) || (p.length > 3 && norm(w.w).includes(p)));
    if (w) return w.t0;
  }
  return L.t0 + (L.t1 - L.t0) * share;
}
function talk(t, L) {
  if (!L || t < L.t0 || t > L.t1) return 0;
  const w = L.words.find(w => t >= w.t0 && t <= w.t1);
  if (!w) return .15;
  return .4 + .6 * Math.abs(Math.sin((t - w.t0) / Math.max(.05, w.t1 - w.t0) * Math.PI));
}
const same = (a, b) => JSON.stringify(a) === JSON.stringify(b);
function cam(cx, cy, z, fn, depth = 1) {
  const k = depth;
  ctx.save(); ctx.translate(540, 900); ctx.scale(1 + (z - 1) * k, 1 + (z - 1) * k);
  ctx.translate(-lerp(540, cx, k), -lerp(900, cy, k)); fn(); ctx.restore();
}

// ---------- scenes: f(V, L, t, lt), lt = seconds since the scene started ----------
// a sub-shot cut: a short gold-white flash where the shot changes inside one line
function flash(t, at, a = .55) { const k = prog(t, at, at + .16); if (k > 0 && k < 1) { ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.fillStyle = `rgba(255,230,190,${a * (1 - k)})`; ctx.fillRect(0, 0, W, H); ctx.restore(); } }
// the real painting full frame, slowly pushed toward `focus`, with an old-print warmth
function paintingFull(img, t, t0, t1, focus, z0 = 1.05, z1 = 1.18) {
  ctx.fillStyle = '#120d0a'; ctx.fillRect(0, 0, W, H);
  if (!img || !img.naturalWidth) return;
  const k = eio(prog(t, t0, t1)), z = lerp(z0, z1, k);
  const sc = Math.max(W / img.naturalWidth, 1500 / img.naturalHeight) * z, iw = img.naturalWidth * sc, ih = img.naturalHeight * sc;
  const ix = clamp(540 - iw * focus[0], W - iw, 0), iy = clamp(900 - ih * focus[1], 1500 - ih, 0);
  ctx.drawImage(toned(img), ix, iy + 150, iw, ih);
  const g = ctx.createLinearGradient(0, 1300, 0, 1800); g.addColorStop(0, 'rgba(18,13,10,0)'); g.addColorStop(1, 'rgba(18,13,10,1)');
  ctx.fillStyle = g; ctx.fillRect(0, 1300, W, 620);
}
function ustaStage(t) {
  room(t, '#0e0c11');
  beam(540, 0, 1500, 220, 900, C.gold, .10, t, 50);
  embers(t, 30, 120, 960, 1550, 1000);
}
const VIS = {
  usta(V, L, t, lt) {
    // The loop: the last line pushes into Usta's eyes until they go dark, the first frame starts on those eyes and
    // pulls back to reveal him.
    setLight(-.6, -.8, { rim: '#ffcf7a', rimA: .8, warm: '#ffd9a0', cool: '#140f1c' });
    const S = 1.25 * CAST.usta.build.height, hx = 540 + 32 * S + 30 * S, hy = 1900 - 886 * S - 4 * S;
    const zin = L.t0 < .5 ? 1 - eio(prog(t, .05, 1.1)) : 0;
    const zout = V.end ? eio(prog(t, L.t0 + .05, L.t1 + .45)) : 0;
    const zz = 1 + 2.2 * Math.max(zin, zout);
    ctx.save(); ctx.translate(hx, hy); ctx.scale(zz, zz); ctx.translate(-hx, -hy);
    ustaStage(t);
    const no = V.no ? wordTime(L, V.no, .5) : 99, yes = V.yes ? wordTime(L, V.yes, .85) : 99;
    const wag = prog(t, no - .2, no + .15) * (1 - prog(t, yes - .3, yes));
    const offer = prog(t, yes - .25, yes + .1);
    const end = V.end ? prog(t, L.t1 + .05, L.t1 + .4) : 0;
    figure('usta', 540, 1900, 1.25, t, {
      legs: 'hide', expr: V.end ? 'knowing' : (offer > .5 ? 'sly' : (wag > .5 ? 'displeased' : 'knowing')), talk: talk(t, L),
      glow: 1 - end, nod: Math.sin(t * 1.1) * .02 - .03 * offer,
      front: { sh: lerp(lerp(.06, 2.5, eo(wag)), 1.1, eo(offer)) + Math.sin(t * 14) * .12 * wag, el: lerp(lerp(.3, .5, wag), -.1, offer), hand: offer > .3 ? 'palm' : (wag > .3 ? 'point' : 'open') },
      hideBack: true, hideFront: wag + offer < .05
    });
    floor(1500, C.gold, .25, 1000);
    fog(t, 1420, .05);
    ctx.restore();
    if (V.no) {
      const k = back(prog(t, no - .05, no + .3));
      if (k > 0) {
        ctx.save(); ctx.translate(300, 1060); ctx.rotate(-.06);
        if (V.no_prop) window[V.no_prop](0, 40, 120 * k, t);
        plate(V.no_label, 0, 130, 54, k, C.red);
        cross(0, -10, 210, prog(t, no + .25, no + .6));
        ctx.restore();
      }
    }
    if (V.yes) {
      const k = back(prog(t, yes - .1, yes + .25));
      if (k > 0) {
        ctx.save(); ctx.translate(780, 1300); ctx.rotate(.04);
        glow(0, 0, 260, 'rgba(232,181,74,1)', .3 * k);
        if (V.yes_prop) window[V.yes_prop](0, -150, 110 * k, t);
        plate(V.yes_label, 0, 0, 62, k, C.gold);
        ctx.restore();
      }
    }
    if (zz > 1.8) { ctx.fillStyle = `rgba(0,0,0,${clamp((zz - 1.8) / 1.4) * (V.end ? 1 : .5)})`; ctx.fillRect(0, 0, W, H); }
  },
};
Object.assign(VIS, SAHNE);

// ---------- overlays ----------
function titleBar(t) {
  ctx.save();  // fully there from the first frame: it is the feed preview
  const label = `KANUN ${EP.kanun || ''}`.trim();
  const lw = measure(label, 40, SERIF, 700, 10);
  text(label, 540, 166, 40, C.gold, SERIF, 700, 'center', 0, C.ink, 10);
  ctx.strokeStyle = rgba(C.gold, .8); ctx.lineWidth = 2;
  ctx.beginPath(); ctx.moveTo(540 - lw / 2 - 30, 168); ctx.lineTo(540 - lw / 2 - 150, 168);
  ctx.moveTo(540 + lw / 2 + 30, 168); ctx.lineTo(540 + lw / 2 + 150, 168); ctx.stroke();
  [[540 - lw / 2 - 22, 168], [540 + lw / 2 + 22, 168]].forEach(([x, y]) => { ctx.save(); ctx.translate(x, y); ctx.rotate(Math.PI / 4); ctx.fillStyle = C.gold; ctx.fillRect(-5, -5, 10, 10); ctx.restore(); });
  const lines = [[up(EP.title.top), C.ivory], [up(EP.title.hi), C.gold]].filter(l => l[0]);
  lines.forEach(([s, col], i) => {
    let size = 86; const w = measure(s, size, SERIF, 900, 2); if (w > 980) size = Math.floor(size * 980 / w);
    ctx.save(); ctx.shadowColor = 'rgba(0,0,0,.9)'; ctx.shadowBlur = 24;
    if (col === C.gold) { ctx.shadowColor = rgba(C.gold, .45); ctx.shadowBlur = 30; }
    text(s, 540, 252 + i * 96, size, col, SERIF, 900, 'center', 8, C.ink, 2);
    ctx.restore();
  });
  ctx.restore();
}
function subtitles(t, line) {
  if (!line || t > line.t1 + .25) return;
  const words = line.words, Y = 1500, S = 74, gap = 36;
  let idx = words.findIndex(w => t >= w.t0 && t < w.t1);
  if (idx < 0) { idx = 0; words.forEach((w, i) => { if (t >= w.t0) idx = i; }); }
  const wd = (w, s) => measure(up(w), s, SANS, 900);
  const groups = []; let cur = [];
  words.forEach((w, i) => {
    const tw = [...cur, i].reduce((a, j) => a + wd(words[j].w, S) + gap, -gap);
    if (cur.length && (cur.length >= 3 || tw > 940)) { groups.push(cur); cur = []; }
    cur.push(i);
  });
  groups.push(cur);
  const grp = groups.find(g => g.includes(idx));
  let size = S; const tw = grp.reduce((a, j) => a + wd(words[j].w, S) + gap, -gap); if (tw > 960) size = Math.floor(S * 960 / tw);
  const ws = grp.map(j => wd(words[j].w, size)); const total = ws.reduce((a, b) => a + b, 0) + gap * (grp.length - 1);
  let x = 540 - total / 2;
  const keys = (line.keys || []).map(norm);
  grp.forEach((j, k) => {
    const w = words[j].w, active = j === idx;
    const isKey = /\d/.test(w) || keys.some(p => p && norm(w).startsWith(p));
    const pop = active ? 1 + .06 * (1 - eo(prog(t, words[j].t0, words[j].t0 + .12))) : 1;
    ctx.save(); ctx.translate(x + ws[k] / 2, Y); ctx.scale(pop, pop);
    if (active) {
      ctx.shadowColor = rgba(C.gold, .6); ctx.shadowBlur = 26;
      ctx.fillStyle = isKey ? C.red : C.gold; rr(-ws[k] / 2 - 12, -size * .62, ws[k] + 24, size * 1.24, 8); ctx.fill();
      ctx.shadowColor = 'transparent';
    }
    text(up(w), 0, 3, size, active ? (isKey ? C.ivory : C.ink) : (isKey ? C.gold : C.ivory), SANS, 900, 'center', active ? 0 : 12);
    ctx.restore(); x += ws[k] + gap;
  });
}

window.setTimings = tm => { window.TIMINGS = tm; TL = buildTimeline(); };
window.draw = function (t) {
  ctx.setTransform(1, 0, 0, 1, 0, 0);
  ctx.globalAlpha = 1; ctx.shadowColor = 'transparent'; ctx.globalCompositeOperation = 'source-over';
  let li = TL.findIndex(l => t < l.t1 + 0.18); if (li < 0) li = TL.length - 1;
  const line = TL[li];
  let si = li; while (si > 0 && same(TL[si - 1].v, line.v)) si--;
  const sceneStart = si === 0 ? 0 : Math.min(TL[si].t0 - 0.12, TL[si - 1].t1 + 0.18);
  const lt = Math.max(0, t - sceneStart);
  const z = 1.035 - .035 * eo(prog(lt, 0, .45)) + .012 * lt;  // a snap in, then a slow push
  ctx.save(); ctx.translate(540, 900); ctx.scale(z, z); ctx.translate(-540, -900);
  const V = line.v || { t: 'usta' };
  (VIS[V.t] || VIS.usta)(V, line, t, lt);
  ctx.restore();
  ctx.globalAlpha = 1; ctx.shadowColor = 'transparent'; ctx.globalCompositeOperation = 'source-over';
  if (si > 0 && lt < .22) { ctx.fillStyle = `rgba(0,0,0,${.7 * (1 - eo(lt / .22))})`; ctx.fillRect(0, 0, W, H); }
  if (si > 0 && lt < .4) {
    const sx = lerp(-500, W + 500, eio(lt / .4));
    ctx.save(); ctx.globalCompositeOperation = 'lighter'; ctx.translate(sx, 960); ctx.rotate(.35);
    const sg = ctx.createLinearGradient(-160, 0, 160, 0);
    sg.addColorStop(0, 'rgba(232,181,74,0)'); sg.addColorStop(.5, 'rgba(232,181,74,.16)'); sg.addColorStop(1, 'rgba(232,181,74,0)');
    ctx.fillStyle = sg; ctx.fillRect(-160, -1400, 320, 2800); ctx.restore();
  }
  vignette(.8);
  // keep the title and subtitles readable over bright scenes
  let g = ctx.createLinearGradient(0, 0, 0, 470); g.addColorStop(0, 'rgba(0,0,0,.75)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 0, W, 470);
  g = ctx.createLinearGradient(0, 1380, 0, 1640); g.addColorStop(0, 'rgba(0,0,0,0)'); g.addColorStop(.5, 'rgba(0,0,0,.55)'); g.addColorStop(1, 'rgba(0,0,0,0)');
  ctx.fillStyle = g; ctx.fillRect(0, 1380, W, 260);
  titleBar(t);
  if (!window.COVER) subtitles(t, t >= line.t0 - .05 ? line : null);
  grain(t);
};
window.cover = function (li) {
  const L = TL[li];
  window.COVER = true; draw(Math.min(L.t1 - .05, wordTime(L, (L.v || {}).key, .4) + 1.0)); window.COVER = false;
};
window.ready = document.fonts.load(`900 40px ${SERIF}`).then(() => document.fonts.load(`900 40px ${SANS}`))
  .then(() => document.fonts.load(`700 40px ${SERIF}`)).then(() => imagesReady).then(() => { draw(0); return true; });
</script></body></html>
