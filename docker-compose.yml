services:
  api:
    build: .
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000
    env_file: .env
    ports:
      - "8000:8000"
    depends_on:
      - redis
  worker:
    build: .
    command: celery -A app.celery_app.celery worker --loglevel=INFO --concurrency=4
    env_file: .env
    depends_on:
      - redis
  redis:
    image: redis:7
    ports:
      - "6379:6379"
