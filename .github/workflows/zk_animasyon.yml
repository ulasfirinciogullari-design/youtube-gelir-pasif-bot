name: Zirvenin Kanunu animasyon (elle)

# Voices, draws and uploads one animated episode to Zirvenin Kanunu. Started by pushing a change to
# animasyon/tetik.txt on the zk-animasyon branch: "<bolum> deneme" (video and storyboard only), "<bolum> gizli"
# (private upload) or "<bolum> zamanla <slot start UTC>" (private, public at that slot; animasyon/kayit.py records it
# in channel-data's uploads.json so the merak Short of that slot is skipped). Since 2026-11-01 (Ulaş gave Claude
# the decisions, card "Haftada 3") one episode goes out on Monday, Wednesday and Friday at 20:00 TR (17:00 UTC).
# Push the trigger between slots: the Shorts workflow's channel-data push gives up on a conflicting uploads.json.
on:
  push:
    branches: [zk-animasyon]
    paths: ['animasyon/tetik.txt']
  workflow_dispatch:

concurrency:
  group: zk-animasyon
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  bolum:
    runs-on: ubuntu-24.04  # ubuntu-latest moved to 26.04 on 2026-10-20 and Playwright 1.55 does not install there
    timeout-minutes: 30
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Bölüm üret
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_flash_v2_5' }}
          ZK_ANIM_MODEL: ${{ vars.ZK_ANIM_MODEL }}
          ZK_ANIM_SPEED: ${{ vars.ZK_ANIM_SPEED }}
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: bash animasyon/calistir.sh
