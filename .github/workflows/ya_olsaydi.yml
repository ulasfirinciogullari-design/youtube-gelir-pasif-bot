name: YA OLSAYDI pilot

# Separate from Zirvenin Kanunu: lives only on the ya-olsaydi branch and talks only to the Ya Olsaydı? channel
# (YA_YT_* secrets). Videos go up private; making them public is a separate, approved step.
on:
  push:
    branches: [ya-olsaydi]
  workflow_dispatch:

concurrency:
  group: ya-olsaydi
  cancel-in-progress: false

permissions:
  contents: write

jobs:
  render:
    runs-on: ubuntu-latest
    timeout-minutes: 40
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - uses: actions/setup-node@v4
        with:
          node-version: '20'

      - name: Araçları kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg
          pip install -q numpy requests
          cd pilot-ay && npm init -y >/dev/null && npm install -q playwright@1.55.0 && npx playwright install --with-deps chromium

      - name: Seslendirme, efekt ve müzik (ElevenLabs)
        env:
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
        run: python pilot-ay/tts.py pilot-ay/out

      - name: Animasyonu kaydet
        run: cd pilot-ay && node render.js out/pilot_sesli.mp4 out/timings.json out/mix.mp3

      - name: YouTube (kanal kontrolü, listeler, gizli yükleme)
        continue-on-error: true
        env:
          YA_YT_CLIENT_ID: ${{ secrets.YA_YT_CLIENT_ID }}
          YA_YT_CLIENT_SECRET: ${{ secrets.YA_YT_CLIENT_SECRET }}
          YA_YT_REFRESH_TOKEN: ${{ secrets.YA_YT_REFRESH_TOKEN }}
        run: python pilot-ay/youtube.py

      - name: Sonucu dala yaz
        run: |
          git config user.name "ya-olsaydi-bot"
          git config user.email "ya-olsaydi-bot@users.noreply.github.com"
          git add pilot-ay/out pilot-ay/audio
          git add pilot-ay/youtube_state.json 2>/dev/null || true
          git commit -m "Pilot render ${GITHUB_SHA::7} [skip ci]" || echo "değişiklik yok"
          git pull --rebase origin ya-olsaydi
          git push origin HEAD:ya-olsaydi
