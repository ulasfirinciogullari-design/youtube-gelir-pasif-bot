name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  syntax:
    runs-on: ubuntu-latest
    timeout-minutes: 90
    strategy:
      fail-fast: false
      matrix:
        shard: [0, 1, 2, 3]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Install application and test dependencies
        run: python -m pip install --disable-pip-version-check -r requirements.txt pytest==9.1.1 'fakeredis[lua]>=2.32,<3'
      - name: Ensure cloud media test dependencies
        run: |
          if ! command -v ffmpeg >/dev/null || ! command -v ffprobe >/dev/null; then
            sudo apt-get update -qq
            sudo apt-get install -y ffmpeg
          fi
      - name: Compile Python sources
        run: python -m compileall -q app
      - name: Run complete test suite shard
        env:
          PYTHONHASHSEED: '0'
        run: python -m scripts.run_ci_tests --index ${{ matrix.shard }} --count 4
      - name: Validate required files
        run: |
          test -f Dockerfile
          test -f requirements.txt
          test -f .env.example
