name: YouTube Shorts Cloud Autopilot (God-Tier)

on:
  schedule:
    # 4 runs a day: 08:00, 13:00, 17:00, 21:00 TR time. Each upload costs ~1,700 of the
    # 10,000 daily YouTube API units, so 4 leaves headroom for retries.
    - cron: '0 5,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Görünürlük'
        required: true
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'unlisted'
          - 'public'
      task:
        description: 'İş (video = Short üret, rapor = kanal temizlik + rakip raporu, temizlik = verilen videoları gizle/sil, ses = seçilen formatın müziğini ElevenLabs ile yeniden üret (karisik = sadece eksik parçalar), referans = video_ids alanındaki örnek Shorts videolarını analiz et)'
        required: true
        default: 'video'
        type: choice
        options:
          - 'video'
          - 'rapor'
          - 'temizlik'
          - 'ses'
          - 'referans'
      gorsel:
        description: 'AI görsel kalitesi (ucuz = Flux Schnell ~0,003 $/görsel, kaliteli = Flux Dev ~0,025 $/görsel)'
        required: false
        default: 'ucuz'
        type: choice
        options:
          - 'ucuz'
          - 'kaliteli'
      format:
        description: 'Format (merak = gerçek görüntülü bilgi videosu, kanalın ana formatı; karisik = merak, karakter ve tarih sırayla, story = tarih hikâyesi, karakter = film/dizi karakteri, comedy = komik dublaj)'
        required: true
        default: 'merak'
        type: choice
        options:
          - 'merak'
          - 'karisik'
          - 'story'
          - 'karakter'
          - 'comedy'
      topic_id:
        description: 'Belirli konu (boş = sıradaki, ör. mk-001, zk-003 veya fk-002)'
        required: false
        default: ''
        type: string
      video_ids:
        description: 'Temizlik veya referans: virgülle ayrılmış video id/link listesi'
        required: false
        default: ''
        type: string
      cleanup_action:
        description: 'Sadece temizlik: private = gizliye al (geri alınabilir), delete = kalıcı sil'
        required: false
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'delete'

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

permissions:
  contents: write  # the channel-data branch keeps metrics, competitor DNA, generated topics and history

jobs:
  produce_original_short:
    name: 🎬 Özgün Short Üret ve Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 FFmpeg ve Fontları Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core fonts-montserrat
          ffmpeg -version | head -1

      - name: 📦 Python Bağımlılıklarını Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🧠 Kanal Hafızasını Getir
        run: |
          if git ls-remote --exit-code --heads origin channel-data >/dev/null 2>&1; then
            git fetch origin channel-data:refs/remotes/origin/channel-data
            git worktree add -B channel-data channel-data origin/channel-data
          else
            git worktree add --orphan -b channel-data channel-data
          fi
          ls channel-data

      - name: 🎬 Özgün Short Üret ve Yayınla
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXEL_API_KEY }}  # Ulaş saved it as PEXEL_API_KEY
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PRIVACY: ${{ github.event_name == 'schedule' && (vars.PUBLISH_PRIVACY || 'public') || github.event.inputs.privacy }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
          CONTENT_FORMAT: ${{ github.event.inputs.format || vars.CONTENT_FORMAT || 'merak' }}  # Ulaş chose the curiosity format (2026-10-13)
          TASK: ${{ github.event.inputs.task || 'video' }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
          CLEANUP_ACTION: ${{ github.event.inputs.cleanup_action || 'private' }}
          IMAGE_MODEL: ${{ (github.event.inputs.gorsel || vars.IMAGE_QUALITY) == 'kaliteli' && 'fal-ai/flux/dev' || 'fal-ai/flux/schnell' }}
        run: |
          mkdir -p output
          if [ "$TASK" = "rapor" ]; then
            python channel_tools.py report
            exit 0
          fi
          if [ "$TASK" = "referans" ]; then
            python channel_tools.py referans --ids "$VIDEO_IDS"
            exit $?
          fi
          if [ "$TASK" = "ses" ]; then
            python scripts/build_audio_library.py "$CONTENT_FORMAT" --replace  # karisik = only fill missing tracks
            exit $?
          fi
          if [ "$TASK" = "temizlik" ]; then
            python channel_tools.py cleanup --action "$CLEANUP_ACTION" --ids "$VIDEO_IDS"
            exit $?
          fi
          echo "⚡ Format: $CONTENT_FORMAT | Görünürlük: $PRIVACY ${TOPIC_ID:+| Konu: $TOPIC_ID}"
          if [ "$CONTENT_FORMAT" = "comedy" ]; then
            python comedy_factory.py --privacy "$PRIVACY"
          else
            ARGS="--privacy $PRIVACY --series $CONTENT_FORMAT"
            if [ -n "$TOPIC_ID" ]; then ARGS="$ARGS --topic-id $TOPIC_ID"; fi
            python original_factory.py $ARGS
          fi

      - name: 💾 Kanal Hafızasını Yedekle
        if: always()
        run: |
          [ -e channel-data/.git ] || { echo "Kanal hafızası klasörü hazırlanamadı, yedek atlandı"; exit 0; }
          mkdir -p channel-data/history
          for f in metrics.json channel_audit.json competitor_dna.json reference_style.json; do
            [ -f "output/$f" ] && cp "output/$f" channel-data/
          done
          cp output/ORIGINAL_*_meta.json output/COMEDY_*_meta.json channel-data/history/ 2>/dev/null || true
          cd channel-data
          git add -A
          if git diff --cached --quiet; then echo "Yeni veri yok"; exit 0; fi
          git -c user.name="zirve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Kanal verisi: run ${{ github.run_id }}"
          # Someone (or a manual seed) may have pushed since this run fetched the branch.
          git -c user.name="zirve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            pull --rebase -q origin channel-data || true
          git push origin HEAD:channel-data

      - name: 📤 Yayın Paketini Sakla (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-short-${{ github.run_id }}
          path: |
            output/ORIGINAL_*.mp4
            output/ORIGINAL_*_thumb.jpg
            output/ORIGINAL_*_meta.json
            output/COMEDY_*.mp4
            output/COMEDY_*_thumb.jpg
            output/COMEDY_*_meta.json
            output/metrics.json
            output/channel_audit.json
            output/competitor_dna.json
            output/reference_style.json
          retention-days: 14
          if-no-files-found: warn
