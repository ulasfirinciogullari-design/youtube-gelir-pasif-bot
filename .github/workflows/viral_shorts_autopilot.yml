name: YouTube Shorts Cloud Autopilot (God-Tier)

on:
  schedule:
    # 4 Peak Viral Hours Daily: 07:00, 11:00, 15:00, 19:00 UTC (10:00, 14:00, 18:00, 22:00 TR Time)
    - cron: '0 7,11,15,19 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma Modu'
        required: true
        default: 'single_video'
        type: choice
        options:
          - 'single_video'
          - 'continuous_until_limit'
      campaign_id:
        description: 'Belirli Kampanya (single_video seçiliyse)'
        required: false
        default: 'shelby_power'
        type: string

jobs:
  produce_viral_shorts:
    name: 🚀 60 FPS Viral Video & Canlı Yayın Fabrikası
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 FFmpeg ve Sistem Araçlarını Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation
          ffmpeg -version

      - name: 📦 Python Bağımlılıklarını Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Sinematik Kasa ve Ses Varlıklarını İndir (GitHub Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/cinematic assets/music assets/sfx
          gh release download vault-v1 --dir assets/cinematic --pattern "*.mp4" --repo ${{ github.repository }} || true
          gh release download vault-v1 --dir assets/music --pattern "*.mp3" --repo ${{ github.repository }} || true
          gh release download vault-v1 --dir assets/sfx --pattern "*.mp3" --repo ${{ github.repository }} || true
          echo "✅ Sinematik varlıklar indirildi:"
          ls -la assets/cinematic/

      - name: 🎬 Durmaksızın Üret ve Yayınla (Maksimum Algoritma Verimi)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          GROK_API_KEY: ${{ secrets.GROK_API_KEY }}
          GROK_BASE_URL: ${{ secrets.GROK_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
        run: |
          mkdir -p output
          if [ "${{ github.event_name }}" = "schedule" ]; then
            echo "⚡ Zamanlanmış Zirve Saati: 1 Master Video üretilip organik algoritma havuzuna sunuluyor..."
            python continuous_autopilot.py --max 1
          elif [ "${{ github.event.inputs.mode }}" = "continuous_until_limit" ]; then
            echo "⚡ Kesintisiz Otopilot: Günde kontrollü yayınlama..."
            python continuous_autopilot.py --max 4 --delay 300
          else
            echo "🎯 Tek Video Modu: ${{ github.event.inputs.campaign_id }}"
            python ultimate_factory.py --id ${{ github.event.inputs.campaign_id }}
            python publish_to_youtube.py --privacy public
          fi

      - name: 📤 Hazır Yayın Paketini Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: viral-shorts-${{ github.run_id }}
          path: |
            output/VIRAL_MASTER_*.mp4
            output/*_thumb.jpg
            output/*_meta.json
          retention-days: 30
