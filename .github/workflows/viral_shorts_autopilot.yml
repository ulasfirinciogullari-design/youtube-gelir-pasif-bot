name: YouTube Shorts Cloud Autopilot (God-Tier)

on:
  schedule:
    # 24 Shorts a day, one every hour around the clock (Ulaş asked for it on 2026-10-15). GitHub delays or drops
    # top-of-hour cron events (runs started up to 3.6 h late; on 2026-10-14 the 11:00 and 14:00 UTC
    # slots never ran), so the workflow ticks at :07 and :37 of each hourly slot and the
    # "🚦 Sıra Kontrolü" step (scripts/slot_gate.py) lets a tick produce only while its slot is empty,
    # 35 min after the last public upload and under the daily cap. A skipped tick costs a few seconds.
    # Uploads have their own YouTube quota of 100 a day since June 2026.
    - cron: '7,37 * * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Görünürlük'
        required: true
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'unlisted'
          - 'public'
      task:
        description: 'İş (video = Short üret, deneme = Short üret ama YouTube''a yükleme (video Artifact olarak kalır), rapor = kanal temizlik + rakip raporu, temizlik = verilen videoları gizle/sil, ses = seçilen formatın müziğini ElevenLabs ile yeniden üret (karisik = sadece eksik parçalar), referans = video_ids alanındaki örnek Shorts videolarını analiz et, sesornek = aynı kısa metni farklı anlatıcı sesleriyle seslendirip kanal hafızasına koy, tiktok = kod boşsa TikTok izin linkini kanal hafızasına yaz, kod doluysa TikTok hesabını bağla)'
        required: true
        default: 'video'
        type: choice
        options:
          - 'video'
          - 'deneme'
          - 'rapor'
          - 'temizlik'
          - 'ses'
          - 'referans'
          - 'sesornek'
          - 'tiktok'
      gorsel:
        description: 'AI görsel kalitesi (ucuz = Flux Schnell ~0,003 $/görsel, kaliteli = Flux Dev ~0,025 $/görsel)'
        required: false
        default: 'ucuz'
        type: choice
        options:
          - 'ucuz'
          - 'kaliteli'
      format:
        description: 'Format (merak = gerçek görüntülü bilgi videosu, kanalın ana formatı; karisik = merak, karakter ve tarih sırayla, story = tarih hikâyesi, karakter = film/dizi karakteri, comedy = komik dublaj)'
        required: true
        default: 'merak'
        type: choice
        options:
          - 'merak'
          - 'karisik'
          - 'story'
          - 'karakter'
          - 'comedy'
      topic_id:
        description: 'Belirli konu (boş = sıradaki, ör. mk-001, zk-003 veya fk-002)'
        required: false
        default: ''
        type: string
      video_ids:
        description: 'Temizlik veya referans: virgülle ayrılmış video id/link listesi'
        required: false
        default: ''
        type: string
      cleanup_action:
        description: 'Sadece temizlik: private = gizliye al (geri alınabilir), delete = kalıcı sil'
        required: false
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'delete'
      kod:
        description: 'Sadece tiktok: TikTok izin sayfasının gösterdiği kod (boş = izin linki üret)'
        required: false
        default: ''
        type: string
      ses:
        description: 'Sadece deneme: anlatıcı sesi (ElevenLabs voice id; model değiştirmek için sonuna :eleven_v3 gibi ekle; boş = varsayılan)'
        required: false
        default: ''
        type: string

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

permissions:
  contents: write  # the channel-data branch keeps metrics, competitor DNA, generated topics and history
  actions: read  # the slot gate checks this workflow's earlier runs in the same slot

jobs:
  produce_original_short:
    name: 🎬 Özgün Short Üret ve Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🧠 Kanal Hafızasını Getir
        run: |
          if git ls-remote --exit-code --heads origin channel-data >/dev/null 2>&1; then
            git fetch origin channel-data:refs/remotes/origin/channel-data
            git worktree add -B channel-data channel-data origin/channel-data
          else
            git worktree add --orphan -b channel-data channel-data
          fi
          ls channel-data

      # Runs on the runner's system Python before setup-python, apt and pip, so a skipped tick costs
      # seconds. Manual runs always get go=true; the reasons for a scheduled tick are printed here.
      - name: 🚦 Sıra Kontrolü
        id: gate
        env:
          GITHUB_TOKEN: ${{ github.token }}
          EVENT_NAME: ${{ github.event_name }}
        run: python3 scripts/slot_gate.py

      - name: 🐍 Python 3.12 Kur
        if: steps.gate.outputs.go == 'true'
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 FFmpeg ve Fontları Kur
        if: steps.gate.outputs.go == 'true'
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core fonts-montserrat
          ffmpeg -version | head -1

      - name: 📦 Python Bağımlılıklarını Kur
        if: steps.gate.outputs.go == 'true'
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Özgün Short Üret ve Yayınla
        if: steps.gate.outputs.go == 'true'
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
          # Narrator settings as repo variables; an unset variable arrives as an empty string, which
          # the Python side treats as unset. Speed, style and stability default to voice sample 2
          # ("Alp, kendi hızıyla 1,15 ve daha enerjik"): the critic called the 1.1x sped-up narration
          # monotone on every Short, and the native speed reads livelier at no extra cost. The model is
          # eleven_flash_v2_5, half a credit a character: Ulaş picked "Alp Flash" by ear from the cost
          # samples (2026-10-15) so 24 Shorts a day fit the credits.
          ELEVENLABS_VOICE_ID: ${{ vars.ELEVENLABS_VOICE_ID }}
          ELEVENLABS_MODEL: ${{ vars.ELEVENLABS_MODEL || 'eleven_flash_v2_5' }}
          ELEVENLABS_SPEED: ${{ vars.ELEVENLABS_SPEED || '1.15' }}
          ELEVENLABS_STYLE: ${{ vars.ELEVENLABS_STYLE || '0.6' }}
          ELEVENLABS_STABILITY: ${{ vars.ELEVENLABS_STABILITY || '0.35' }}
          SES: ${{ github.event.inputs.ses }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY || secrets.PEXEL_API_KEY }}  # Ulaş saved it as PEXEL_API_KEY
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          TIKTOK_CLIENT_KEY: ${{ secrets.TIKTOK_CLIENT_KEY }}
          TIKTOK_CLIENT_SECRET: ${{ secrets.TIKTOK_CLIENT_SECRET }}
          KOD: ${{ github.event.inputs.kod }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PRIVACY: ${{ github.event_name == 'schedule' && (vars.PUBLISH_PRIVACY || 'public') || github.event.inputs.privacy }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
          CONTENT_FORMAT: ${{ github.event.inputs.format || vars.CONTENT_FORMAT || 'merak' }}  # Ulaş chose the curiosity format (2026-10-13)
          TASK: ${{ github.event.inputs.task || 'video' }}
          VIDEO_IDS: ${{ github.event.inputs.video_ids }}
          CLEANUP_ACTION: ${{ github.event.inputs.cleanup_action || 'private' }}
          IMAGE_MODEL: ${{ (github.event.inputs.gorsel || vars.IMAGE_QUALITY) == 'kaliteli' && 'fal-ai/flux/dev' || 'fal-ai/flux/schnell' }}
        run: |
          mkdir -p output
          if [ "$TASK" = "rapor" ]; then
            python channel_tools.py report
            exit 0
          fi
          if [ "$TASK" = "referans" ]; then
            python channel_tools.py referans --ids "$VIDEO_IDS"
            exit $?
          fi
          if [ "$TASK" = "ses" ]; then
            python scripts/build_audio_library.py "$CONTENT_FORMAT" --replace  # karisik = only fill missing tracks
            exit $?
          fi
          if [ "$TASK" = "temizlik" ]; then
            python channel_tools.py cleanup --action "$CLEANUP_ACTION" --ids "$VIDEO_IDS"
            exit $?
          fi
          if [ "$TASK" = "tiktok" ]; then
            # The consent link or the encrypted token lands in channel-data; the backup step commits it.
            python -m app.services.tiktok login --code "$KOD" --data channel-data
            exit $?
          fi
          if [ "$TASK" = "sesornek" ]; then
            # The backup step commits the samples to the channel-data branch.
            python scripts/voice_samples.py --out channel-data/history/voice_samples
            exit $?
          fi
          if [ "$TASK" = "deneme" ]; then
            # A sample to inspect without filling the channel with private test videos.
            if [ -n "$SES" ]; then
              # Try a narrator on this sample only: "<voice id>" or "<voice id>:<model>".
              export ELEVENLABS_VOICE_ID="${SES%%:*}"
              if [[ "$SES" == *:* ]]; then export ELEVENLABS_MODEL="${SES#*:}"; fi
            fi
            ARGS="--no-upload --series $CONTENT_FORMAT"
            if [ -n "$TOPIC_ID" ]; then ARGS="$ARGS --topic-id $TOPIC_ID"; fi
            KEEP_AUDIO=1 python original_factory.py $ARGS
            exit $?
          fi
          echo "⚡ Format: $CONTENT_FORMAT | Görünürlük: $PRIVACY ${TOPIC_ID:+| Konu: $TOPIC_ID}"
          if [ "$CONTENT_FORMAT" = "comedy" ]; then
            python comedy_factory.py --privacy "$PRIVACY"
          else
            ARGS="--privacy $PRIVACY --series $CONTENT_FORMAT"
            if [ -n "$TOPIC_ID" ]; then ARGS="$ARGS --topic-id $TOPIC_ID"; fi
            python original_factory.py $ARGS
          fi

      - name: 💾 Kanal Hafızasını Yedekle
        if: always() && steps.gate.outputs.go == 'true'
        run: |
          [ -e channel-data/.git ] || { echo "Kanal hafızası klasörü hazırlanamadı, yedek atlandı"; exit 0; }
          mkdir -p channel-data/history
          for f in metrics.json channel_audit.json competitor_dna.json reference_style.json; do
            [ -f "output/$f" ] && cp "output/$f" channel-data/
          done
          # The storyboard (one frame a second) lets a session that cannot open YouTube see the video; a no-upload
          # sample also leaves its narration and mix (_voice.mp3, _mix.mp3) to be measured.
          cp output/ORIGINAL_*_meta.json output/ORIGINAL_*_story.jpg output/ORIGINAL_*_voice.mp3 output/ORIGINAL_*_mix.mp3 \
            output/COMEDY_*_meta.json channel-data/history/ 2>/dev/null || true
          cd channel-data
          git add -A
          if git diff --cached --quiet; then echo "Yeni veri yok"; exit 0; fi
          git -c user.name="zirve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            commit -qm "Kanal verisi: run ${{ github.run_id }}"
          # Someone (or a manual seed) may have pushed since this run fetched the branch.
          git -c user.name="zirve-bot" -c user.email="41898282+github-actions[bot]@users.noreply.github.com" \
            pull --rebase -q origin channel-data || true
          git push origin HEAD:channel-data

      - name: 📤 Yayın Paketini Sakla (Artifact)
        if: always() && steps.gate.outputs.go == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: original-short-${{ github.run_id }}
          path: |
            output/ORIGINAL_*.mp4
            output/ORIGINAL_*_thumb.jpg
            output/ORIGINAL_*_meta.json
            output/COMEDY_*.mp4
            output/COMEDY_*_thumb.jpg
            output/COMEDY_*_meta.json
            output/metrics.json
            output/channel_audit.json
            output/competitor_dna.json
            output/reference_style.json
          retention-days: 14
          if-no-files-found: warn
