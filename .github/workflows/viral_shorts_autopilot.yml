name: YouTube Shorts Cloud Autopilot (God-Tier)

on:
  schedule:
    # Runs automatically twice every day at 09:00 and 17:00 UTC (12:00 and 20:00 TR)
    - cron: '0 */2 * * *'
  workflow_dispatch:
    inputs:
      mode:
        description: 'Çalışma Modu'
        required: true
        default: 'continuous_until_limit'
        type: choice
        options:
          - 'continuous_until_limit'
          - 'single_video'
      campaign_id:
        description: 'Belirli Kampanya (single_video seçiliyse)'
        required: false
        default: 'oppenheimer_doom'
        type: string

jobs:
  produce_viral_shorts:
    name: 🚀 60 FPS Viral Video & Canlı Yayın Fabrikası
    runs-on: ubuntu-latest
    timeout-minutes: 180

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 FFmpeg ve Sistem Araçlarını Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation
          ffmpeg -version

      - name: 📦 Python Bağımlılıklarını Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 📥 Sinematik Kasa ve Ses Varlıklarını İndir (GitHub Releases)
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          mkdir -p assets/cinematic assets/music assets/sfx
          gh release download vault-v1 --dir assets/cinematic --pattern "*.mp4" --repo ${{ github.repository }} || true
          gh release download vault-v1 --dir assets/music --pattern "*.mp3" --repo ${{ github.repository }} || true
          gh release download vault-v1 --dir assets/sfx --pattern "*.mp3" --repo ${{ github.repository }} || true
          echo "✅ Sinematik varlıklar indirildi:"
          ls -la assets/cinematic/

      - name: 🎬 Durmaksızın Üret ve Yayınla (Günlük Limite Kadar)
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
        run: |
          mkdir -p output
          if [ "${{ github.event_name }}" = "schedule" ] || [ "${{ github.event.inputs.mode }}" = "continuous_until_limit" ]; then
            echo "⚡ Kesintisiz Otopilot Aktif: Günlük limite kadar durmadan üretip yayınlanıyor..."
            python continuous_autopilot.py --max 8 --delay 90
          else
            echo "🎯 Tek Video Modu: ${{ github.event.inputs.campaign_id }}"
            python ultimate_factory.py --id ${{ github.event.inputs.campaign_id }}
            python publish_to_youtube.py --privacy public
          fi

      - name: 📤 Hazır Yayın Paketini Yükle (Artifact)
        uses: actions/upload-artifact@v4
        with:
          name: viral-shorts-${{ github.run_id }}
          path: |
            output/VIRAL_MASTER_*.mp4
            output/*_thumb.jpg
            output/*_meta.json
          retention-days: 30
