name: YouTube Shorts Cloud Autopilot (God-Tier)

on:
  schedule:
    # 4 runs a day: 08:00, 13:00, 17:00, 21:00 TR time. Each upload costs ~1,700 of the
    # 10,000 daily YouTube API units, so 4 leaves headroom for retries.
    - cron: '0 5,10,14,18 * * *'
  workflow_dispatch:
    inputs:
      privacy:
        description: 'Görünürlük'
        required: true
        default: 'private'
        type: choice
        options:
          - 'private'
          - 'unlisted'
          - 'public'
      topic_id:
        description: 'Belirli konu (boş = sıradaki, ör. zk-003)'
        required: false
        default: ''
        type: string

concurrency:
  group: shorts-autopilot
  cancel-in-progress: false

jobs:
  produce_original_short:
    name: 🎬 Özgün Short Üret ve Yayınla
    runs-on: ubuntu-latest
    timeout-minutes: 60

    steps:
      - name: 📥 Repoyu Çek
        uses: actions/checkout@v4

      - name: 🐍 Python 3.12 Kur
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'
          cache: 'pip'

      - name: 🎥 FFmpeg ve Fontları Kur
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y --no-install-recommends ffmpeg fonts-liberation fonts-dejavu-core
          ffmpeg -version | head -1

      - name: 📦 Python Bağımlılıklarını Kur
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: 🎬 Özgün Short Üret ve Yayınla
        env:
          YOUTUBE_CLIENT_ID: ${{ secrets.YOUTUBE_CLIENT_ID }}
          YOUTUBE_CLIENT_SECRET: ${{ secrets.YOUTUBE_CLIENT_SECRET }}
          YOUTUBE_REFRESH_TOKEN: ${{ secrets.YOUTUBE_REFRESH_TOKEN }}
          FAL_KEY: ${{ secrets.FAL_KEY }}
          PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
          PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
          GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY || secrets.GEMINI_API }}
          ANTHROPIC_AUTH_TOKEN: ${{ secrets.ANTHROPIC_AUTH_TOKEN }}
          ANTHROPIC_BASE_URL: ${{ secrets.ANTHROPIC_BASE_URL }}
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
          OPENAI_BASE_URL: ${{ secrets.OPENAI_BASE_URL }}
          PRIVACY: ${{ github.event_name == 'schedule' && (vars.PUBLISH_PRIVACY || 'public') || github.event.inputs.privacy }}
          TOPIC_ID: ${{ github.event.inputs.topic_id }}
        run: |
          mkdir -p output
          ARGS="--privacy $PRIVACY"
          if [ -n "$TOPIC_ID" ]; then ARGS="$ARGS --topic-id $TOPIC_ID"; fi
          echo "⚡ Görünürlük: $PRIVACY ${TOPIC_ID:+| Konu: $TOPIC_ID}"
          python original_factory.py $ARGS

      - name: 📤 Yayın Paketini Sakla (Artifact)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: original-short-${{ github.run_id }}
          path: |
            output/ORIGINAL_*.mp4
            output/ORIGINAL_*_thumb.jpg
            output/ORIGINAL_*_meta.json
          retention-days: 14
          if-no-files-found: warn
